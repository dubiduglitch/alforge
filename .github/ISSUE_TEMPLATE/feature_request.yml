name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem does this solve? What's the use case?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Any CLI flags, config options, or behavior changes?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about
  - type: checkboxes
    id: forges
    attributes:
      label: Affected forges
      options:
        - label: GitHub
        - label: GitLab
        - label: Codeberg
        - label: Gitea/Forgejo (self-hosted)
        - label: All / forge-agnostic
  - type: checkboxes
    id: areas
    attributes:
      label: Areas affected
      options:
        - label: Asset selection / architecture detection
        - label: Checksum verification
        - label: Timer / automation
        - label: Browser extension / URI scheme
        - label: Configuration / tokens
        - label: Multi-forge support
        - label: AppImage support
        - label: CLI / UX