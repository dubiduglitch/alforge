[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitget"
version = "0.1.0"
description = "Install and keep up to date .deb packages published on GitHub, GitLab, Codeberg and any Gitea/Forgejo instance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rsxn" }]
keywords = ["deb", "debian", "github", "gitlab", "gitea", "package-manager", "apt"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
gitget = "gitget.cli:main"

[project.urls]
Homepage = "https://github.com/rsxn/gitget"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
